# Large-suite Full CITA-Net. Same model as cita_full, pointed at the large data
# root with its own (extended) ontology, grid blocking, and sector-streamed
# training. Trained/evaluated by scripts/train_large.py.
stage: cita_full_large
seed: 20250606
device: auto
data_root: data/battlefield_stkg_large
ontology_dir: data/battlefield_stkg_large/ontology

blocking:
  dt_max_s: 180.0
  theta_text: 0.3
  grid_cell_m: 400.0
  r_err_floor_m: 80.0    # absorb position-noise tails so true matches survive reach
  use_text_gate: false   # paraphrase diversity makes a bag-of-tokens gate drop true matches
  type_by_category: true # within-category mis-ID (BMP-2<->BMP-1, T-72<->T-62) stays a candidate

encoder:
  d_model: 128
  text_encoder: learned
  use_source_gate: true

graph:
  enabled: true
  gnn_layers: 2
  n_heads: 4
  hops: 2

cta:
  enabled_terms: [sem, time, motion, state, rel, src]

decoder:
  enabled: true
  num_slots: 48          # sectors hold many identities (~30); K > max + margin
  sinkhorn_iters: 20
  sinkhorn_temp: 0.5
  sinkhorn_col_strength: 0.1

loss:
  # Matching (pair + assign) drives identity recovery; the derived transition
  # BCE over all candidate pairs is large-magnitude, so it is down-weighted to
  # avoid starving the matching signal at scale.
  lambda_pair: 2.0
  lambda_transition: 0.3
  lambda_trajectory: 0.5
  lambda_dangling: 1.0
  lambda_assign: 2.0
  pair_pos_weight: 5.0   # cross-KG positives rarer at this scale

train:
  lr: 1.0e-3
  epochs: 60             # bounded for CPU; sector subsampling per epoch
  log_every: 10
