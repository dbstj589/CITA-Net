# CONVERGENCE CHECK (80 epochs) — configs/realistic_v1/no_rel.yaml 사본에서 epochs 40->80 만 변경.
# 목적: rel 효과가 40에폭 예산의 인공물인지 판정. 사전 등록: docs/PREREG_realistic_v1_conv80.md
# 원본 configs/realistic_v1/ 는 무수정. 산출은 runs/realistic_v1_conv80/ 로 격리.
# GENERATED for realistic-v1 constraint-term conditional-validity MAIN run.
# Full CITA-Net (graph+decoder) on data/realistic_v1, blocking widened for gold
# coverage (dt_max_s=450, r_err_floor_m=300; §4b), num_slots=200 (>161 = max true
# identities/sector, avoids amb160-style slot starvation). Single term dropped from
# cta.enabled_terms per variant; all else identical to the amb160 main run.
# Originals (amb160_main/*, ablation/*) untouched.
stage: cita_full_realistic_v1_no_rel_conv80
seed: 19521006
device: auto
data_root: data/realistic_v1
ontology_dir: data/realistic_v1/ontology
blocking:
  dt_max_s: 450.0
  theta_text: 0.3
  grid_cell_m: 400.0
  r_err_floor_m: 300.0
  use_text_gate: false
  type_by_category: true
encoder:
  d_model: 128
  text_encoder: learned
  use_source_gate: true
graph:
  enabled: true
  gnn_layers: 2
  n_heads: 4
  hops: 2
cta:
  enabled_terms:
  - sem
  - time
  - motion
  - state
  - src
decoder:
  enabled: true
  num_slots: 200
  sinkhorn_iters: 20
  sinkhorn_temp: 0.5
  sinkhorn_col_strength: 0.1
loss:
  lambda_pair: 2.0
  lambda_transition: 0.3
  lambda_trajectory: 0.5
  lambda_dangling: 1.0
  lambda_assign: 2.0
  pair_pos_weight: 5.0
train:
  lr: 0.001
  epochs: 80
  log_every: 10
