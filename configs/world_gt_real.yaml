# Real-scale battlefield GT (~6x8 km, fixed space). Triple floor met by
# non-spatial growth (time density / relations / events / reification), NOT by
# adding sectors. Single global terrain. Sensor-neutral, no duplicate triples.

mode: real
global_seed: 19521006

time:
  epoch: "1952-10-06T00:00:00Z"
  window_seconds: 14400
  dt_seconds: 600            # moving-object sampling step (time density knob)
  static_baseline_seconds: 4800  # coarse baseline for static objects (no repeats)
  phases: 6                  # attack/counter rotation + entry/exit/attrition

world_scope:                 # FIXED real space: 3x4 sectors of 2 km over ~6x8 km
  mode: tiled
  cols: 3
  rows: 4
  sector_pitch_m: 2000.0

entities:
  per_sector: 100            # ~ hundreds-1500 total abstract units (roster ratios)
  attrition_frac: 0.22
  reinforce_frac: 0.5
  tactical_per_phase: 4      # phase-stamped tactical relations per active entity

terrain:                     # single GLOBAL real-scale field (mode fixed inside)
  grid_resolution_m: 50.0
  area_width_m: 6000.0
  area_height_m: 8000.0
  base_elevation_m: 50.0
  peak_elevation_m: 395.0
  peak_sigma_m: 900.0
  ridge_amplitude_m: 220.0
  stream_north_offset_m: 5000.0
  canopy_frac: 0.14

reification:
  predicates: [engagedWith, firesAt, movesToward, occupies, withdrawsFrom, supports, screens, reinforces]
  per_sector_cap: 100000

ontology_dir: data/battlefield_hill395_large/ontology

target_triples_floor: 300000
output_dir: data/hill395_world_gt_real
