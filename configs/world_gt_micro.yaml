# Micro readable single-engagement GT. ~40 objects that actually move, one small
# area (no sectors), dense dt=60, with an explicit causal chain (approach ->
# detect -> request -> fire -> halt/withdraw). Triple count is a RESULT, not a
# target. Sensor-neutral. Synthetic scenario logic, not a real-battle reconstruction.

mode: micro
global_seed: 19521006

time:
  epoch: "1952-10-06T00:00:00Z"
  window_seconds: 14400        # 4 h single engagement
  dt_seconds: 60               # 1-min dense sampling -> smooth motion
  static_baseline_seconds: 1800  # coarse baseline for the few static emplacements

entities:
  waves: 4                     # CCF assault waves (one causal cycle each)
  squads_per_wave: 5           # CCF squads per wave
  rok_infantry: 8              # ROK defenders on the line (+ observer)

terrain:                       # single small real-scale field: one hill + ridge + approach
  grid_resolution_m: 25.0
  area_width_m: 3000.0
  area_height_m: 3600.0
  base_elevation_m: 50.0
  peak_elevation_m: 395.0
  peak_sigma_m: 500.0
  ridge_amplitude_m: 180.0
  stream_north_offset_m: 3000.0
  canopy_frac: 0.14

reification:
  predicates: [engagedWith, firesAt, movesToward, occupies, withdrawsFrom, supports, screens]
  per_sector_cap: 100000

ontology_dir: data/battlefield_hill395_large/ontology

output_dir: data/hill395_world_gt_micro
