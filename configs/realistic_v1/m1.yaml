# GENERATED for the realistic-v1 difficulty gate: copy of configs/ablation/m1.yaml
# with data_root/ontology -> data/realistic_v1 and the blocking window/slack widened
# so gold cross-KG pairs survive under the injected uncertainties (§4b):
#   - dt_max_s 180 -> 450  (empirical minimum for >=0.98 gold-pair survival; the
#     max reported-minus-true time error is ~343s, so 450 keeps offset/delay-shifted
#     pairs in-window. 2x-error=700 gives the same 0.9934 survival at ~25% more
#     memory/time, so 450 is used; both pass the coverage gate.)
#   - r_err_floor_m 80 -> 300  (absorbs the 5x ACOUSTIC position noise, cep 300m)
# These blocking changes ENLARGE the candidate/negative set (harder, not easier);
# they are the experiment-validity precondition, not a difficulty relaxation.
# Originals untouched. m1 = pair classifier only (graph/decoder off, greedy decode).
stage: cita_full_hill395_m1_realistic_v1
seed: 19521006
device: auto
data_root: data/realistic_v1
ontology_dir: data/realistic_v1/ontology
blocking:
  dt_max_s: 450.0
  theta_text: 0.3
  grid_cell_m: 400.0
  r_err_floor_m: 300.0
  use_text_gate: false
  type_by_category: true
encoder:
  d_model: 128
  text_encoder: learned
  use_source_gate: true
graph:
  enabled: false
  gnn_layers: 2
  n_heads: 4
  hops: 2
cta:
  enabled_terms:
  - sem
  - time
  - motion
  - state
  - rel
  - src
decoder:
  enabled: false
  num_slots: 160
  sinkhorn_iters: 20
  sinkhorn_temp: 0.5
  sinkhorn_col_strength: 0.1
loss:
  lambda_pair: 2.0
  lambda_transition: 0.3
  lambda_trajectory: 0.5
  lambda_dangling: 1.0
  lambda_assign: 2.0
  pair_pos_weight: 5.0
train:
  lr: 0.001
  epochs: 40
  log_every: 10
