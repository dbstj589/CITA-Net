# Hill 395 observation states + pairwise co-reference compatibility C
# (b_state = gamma * log(C[s_i, s_j] + eps)). Asymmetric: e.g.
# Withdrawing->Occupying is implausible for the same object; Destroyed->
# {active} ~ 0. Per-type overrides push towed Emplaced->Moving very low.

states:
  - Moving
  - Halted
  - Approaching
  - Engaging
  - Occupying
  - Holding
  - Emplaced
  - Firing
  - Withdrawing
  - Unknown
  - Destroyed

