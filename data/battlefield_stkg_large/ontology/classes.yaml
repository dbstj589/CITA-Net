# Object-type taxonomy for the LARGE suite (superset of the small-suite types).
# Adds dismounted infantry (Soldier), formation/org nodes (Unit, no kinematics),
# and extra armour variants so a sector can field many same-type objects
# (hard negatives). v_max_mps is state-conditioned (§4.1/§4.4); towed weapons
# self-propel at 0.

UNKNOWN:
  category: unknown
  mobility: unknown
  default_state: Unknown
  default_v_max_mps: 25.0
  v_max_mps: {Emplaced: 25.0, Firing: 25.0, Halted: 25.0, Moving: 25.0, Unknown: 25.0, Destroyed: 25.0}

Unit:
  category: formation        # platoon/squad/section org node -- no observations
  mobility: na
  default_state: Unknown
  default_v_max_mps: 25.0
  v_max_mps: {Unknown: 25.0}

