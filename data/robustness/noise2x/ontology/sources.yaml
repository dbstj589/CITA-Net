# Hill 395 intelligence sources with reliability priors. KG A uses own
# direct sensors (VISUAL_OBS/RADAR/ARTILLERY_OBS); KG B uses standoff /
# indirect sources (AERIAL/SIGINT/ACOUSTIC/HUMINT).

VISUAL_OBS:
  description: Forward visual / EO observer (전방관측조)
  reliability: 0.9
  type_reliability: 0.9
  pos_reliability: 0.88
  cep_m: 15.0

RADAR:
  description: Ground-surveillance / counter-battery radar
  reliability: 0.8
  type_reliability: 0.4
  pos_reliability: 0.75
  cep_m: 30.0

ARTILLERY_OBS:
  description: Artillery forward observer (포병관측)
  reliability: 0.75
  type_reliability: 0.5
  pos_reliability: 0.71
  cep_m: 35.0

AERIAL:
  description: UN air reconnaissance / tac-air observer
  reliability: 0.8
  type_reliability: 0.7
  pos_reliability: 0.79
  cep_m: 25.0

SIGINT:
  description: Signals-intelligence emitter geolocation (무선감청)
  reliability: 0.65
  type_reliability: 0.6
  pos_reliability: 0.58
  cep_m: 50.0

ACOUSTIC:
  description: Acoustic gunfire / vehicle localisation (청음조)
  reliability: 0.55
  type_reliability: 0.3
  pos_reliability: 0.5
  cep_m: 60.0

HUMINT:
  description: Scout report / POW interrogation (정찰조/포로)
  reliability: 0.55
  type_reliability: 0.7
  pos_reliability: 0.25
  cep_m: 90.0
